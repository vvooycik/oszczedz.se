<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) actually reports the notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Rewritten at runtime to the resolved ground (see applyTheme): with a
         `default` status bar iOS paints that strip itself, and a fixed colour
         would clash with five of the six accents and both modes. The static
         value is only what the first paint uses. -->
    <meta name="theme-color" content="#1a1917" />

    <!-- iOS still reads these rather than the manifest for standalone mode.
         `default`, not `black-translucent`: with a translucent bar iOS treats
         the status bar as retractable browser chrome and hands the app a web
         view 62pt shorter than the screen (measured — innerHeight 894 against a
         956pt screen), stranding the tab bar above a strip it cannot paint. The
         cost is that content no longer runs under the status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="oszczędź.se" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Spectral for words, IBM Plex Sans for every figure. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>oszczędź.se</title>

    <script>
      // Applies the cached theme before first paint. Without this the page
      // renders with the default ground and then snaps to the user's — very
      // visible when the choice is light and the default is dark.
      //
      // Deliberately duplicates a few lines of src/theme/theme.ts: it must run
      // as a blocking inline script, before any module loads. ThemeProvider
      // takes over once React mounts.
      ;(function () {
        var ACCENTS = {
          gold: [85, '#b68235', '#e1ad66'],
          copper: [48, 'oklch(56% 0.13 48)', 'oklch(72% 0.13 48)'],
          claret: [18, 'oklch(45% 0.13 18)', 'oklch(67% 0.13 18)'],
          olive: [120, 'oklch(50% 0.08 120)', 'oklch(74% 0.08 120)'],
          ink: [252, 'oklch(46% 0.09 252)', 'oklch(72% 0.09 252)'],
          plum: [340, 'oklch(48% 0.12 340)', 'oklch(70% 0.12 340)'],
        }
        var p = { mode: 'system', accent: 'gold', tint: 0.008 }
        try {
          var raw = localStorage.getItem('oszczedz.theme')
          if (raw) {
            var s = JSON.parse(raw)
            if (s && typeof s === 'object') p = Object.assign(p, s)
          }
        } catch (e) {
          /* corrupt cache: fall through to defaults */
        }
        var mode =
          p.mode === 'light' || p.mode === 'dark'
            ? p.mode
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        var a = ACCENTS[p.accent] || ACCENTS.gold
        var r = document.documentElement
        r.dataset.mode = mode
        r.style.setProperty('--h', String(a[0]))
        r.style.setProperty('--tint', String(p.tint))
        r.style.setProperty('--c-accent', mode === 'dark' ? a[2] : a[1])
        r.style.colorScheme = mode

        // Status bar. iOS paints that strip itself now that it is not
        // translucent, and it reads the meta before any module runs — leaving it
        // to applyTheme would flash a near-black bar over a light ground on
        // every launch. Same oklch->hex as src/theme/theme.ts, same reason the
        // accent table above is duplicated.
        var L = mode === 'dark' ? 0.17 : 0.96
        var C = mode === 'dark' ? p.tint : 0.004
        var rad = (a[0] * Math.PI) / 180
        var ca = C * Math.cos(rad)
        var cb = C * Math.sin(rad)
        var l = Math.pow(L + 0.3963377774 * ca + 0.2158037573 * cb, 3)
        var m = Math.pow(L - 0.1055613458 * ca - 0.0638541728 * cb, 3)
        var s = Math.pow(L - 0.0894841775 * ca - 1.291485548 * cb, 3)
        var hex = '#'
        ;[
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ].forEach(function (v) {
          var e = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055
          hex += ('0' + Math.round(Math.min(1, Math.max(0, e)) * 255).toString(16)).slice(-2)
        })
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', hex)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
