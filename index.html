<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) actually reports the notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Rewritten at runtime to the resolved ground (see applyTheme): with a
         `default` status bar iOS paints that strip itself, and a fixed colour
         would clash with five of the six accents and both modes. The static
         value is only what the first paint uses. -->
    <meta name="theme-color" content="#090b0f" />

    <!-- iOS still reads these rather than the manifest for standalone mode.
         `default`, not `black-translucent`: with a translucent bar iOS treats
         the status bar as retractable browser chrome and hands the app a web
         view 62pt shorter than the screen (measured — innerHeight 894 against a
         956pt screen), stranding the tab bar above a strip it cannot paint. The
         cost is that content no longer runs under the status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="oszczędź.se" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- One family for words and figures alike. The serif/sans split the app
         used to run - Spectral for words, IBM Plex for every number - is what
         made it read as aged; figures keep their accounting feel from
         `tabular-nums` rather than from a second typeface. 400/500/600 only. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>oszczędź.se</title>

    <script>
      // Applies the cached theme before first paint. Without this the page
      // renders with the default ground and then snaps to the user's — very
      // visible when the choice is light and the default is dark.
      //
      // Deliberately duplicates a few lines of src/theme/theme.ts: it must run
      // as a blocking inline script, before any module loads. ThemeProvider
      // takes over once React mounts.
      ;(function () {
        var ACCENTS = {
          ink: [255, 'oklch(52% 0.14 255)', 'oklch(76% 0.12 255)'],
          gold: [85, 'oklch(54% 0.12 85)', 'oklch(74% 0.13 85)'],
          copper: [40, 'oklch(52% 0.13 40)', 'oklch(68% 0.13 40)'],
          moss: [155, 'oklch(50% 0.11 155)', 'oklch(70% 0.12 155)'],
          plum: [300, 'oklch(50% 0.12 300)', 'oklch(66% 0.12 300)'],
          slate: [200, 'oklch(50% 0.09 200)', 'oklch(72% 0.1 200)'],
        }
        // Retired by the visual refresh; map rather than reset a real choice.
        var RETIRED = { claret: 'copper', olive: 'moss' }
        // The ground stops at two colours now that it no longer takes the
        // accent's hue or a user-chosen chroma, so this script no longer needs
        // a copy of the OKLab matrix — just the two answers it used to compute.
        // Keep in step with GROUND_HEX in src/theme/theme.ts.
        var GROUND = { light: '#f2f3f6', dark: '#090b0f' }

        var p = { mode: 'system', accent: 'gold', tintSurfaces: false }
        try {
          var raw = localStorage.getItem('oszczedz.theme')
          if (raw) {
            var s = JSON.parse(raw)
            if (s && typeof s === 'object') p = Object.assign(p, s)
          }
        } catch (e) {
          /* corrupt cache: fall through to defaults */
        }
        var mode =
          p.mode === 'light' || p.mode === 'dark'
            ? p.mode
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        var name = ACCENTS[p.accent] ? p.accent : RETIRED[p.accent] || 'gold'
        var a = ACCENTS[name]
        // `tint` is the retired four-step ground chroma; anything above zero
        // meant "show me the accent in the ground", which is what the switch is.
        var tinted =
          typeof p.tintSurfaces === 'boolean' ? p.tintSurfaces : Number(p.tint || 0) > 0

        var r = document.documentElement
        r.dataset.mode = mode
        r.style.setProperty('--h', String(a[0]))
        r.style.setProperty('--c-accent', mode === 'dark' ? a[2] : a[1])
        r.style.setProperty('--c-accent-mix', tinted ? '4%' : '0%')
        r.style.colorScheme = mode

        // Status bar. iOS paints that strip itself now that it is not
        // translucent, and it reads the meta before any module runs — leaving it
        // to applyTheme would flash a near-black bar over a light ground on
        // every launch.
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', GROUND[mode])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
